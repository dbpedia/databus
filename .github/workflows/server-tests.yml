name: Server integration tests

on:
  push:
    paths:
      - 'server/**'
      - 'docker-compose.yml'
      - 'search/**'
      - '.github/workflows/server-tests.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'docker-compose.yml'
      - 'search/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Start backing services
        run: docker compose up -d gstore virtuoso lookup

      - name: Wait for gstore
        run: |
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3002/ && exit 0
            sleep 2
          done
          exit 1

      - name: Wait for lookup
        run: |
          for i in $(seq 1 60); do
            curl -sf "http://localhost:3004/api/search?query=health" && exit 0
            sleep 2
          done
          exit 1

      - name: Run integration tests
        working-directory: server
        env:
          DATABUS_RESOURCE_BASE_URL: http://localhost:3000
          DATABUS_DATABASE_URL: http://localhost:3002
          LOOKUP_BASE_URL: http://localhost:3004
          DATABUS_NAME: CI Test Databus
          DATABUS_ABSTRACT: CI
          DATABUS_PRIVATE_MODE: 'false'
          DATABUS_OIDC_ISSUER_BASE_URL: https://kilt.eu.auth0.com
          DATABUS_OIDC_CLIENT_ID: ci-placeholder
          DATABUS_OIDC_SECRET: ci-placeholder
          MAX_WORKERS: '1'
        run: npm test

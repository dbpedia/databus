name: Server integration tests

on:
  push:
    paths:
      - 'server/**'
      - 'search/**'
      - '.github/workflows/server-tests.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'search/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run integration tests
        working-directory: server
        env:
          DATABUS_RESOURCE_BASE_URL: http://localhost:3000
          DATABUS_NAME: CI Test Databus
          DATABUS_ABSTRACT: CI
          DATABUS_PRIVATE_MODE: 'false'
          DATABUS_OIDC_ISSUER_BASE_URL: https://kilt.eu.auth0.com
          DATABUS_OIDC_CLIENT_ID: ci-placeholder
          DATABUS_OIDC_SECRET: ci-placeholder
          MAX_WORKERS: '1'
        run: npm test

name: Release Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-docker-image
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-22.04
    steps:
      - name: Release branch only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases run on main only (got ${{ github.ref }})."
          exit 1

      - uses: actions/checkout@v4

      - name: Decide whether to build
        id: ver
        run: |
          set -euo pipefail
          VERSION=$(node -e "const v=require('./server/package.json').version; if(!/^[0-9A-Za-z_][0-9A-Za-z_.-]{0,127}$/.test(v)){console.error('invalid version: '+v); process.exit(1)} process.stdout.write(v)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            echo "git ls-remote failed ($status)"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$status" -eq 2 ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Building $VERSION"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Tag $VERSION already exists. Not building. Run this workflow manually to rebuild and move the tag."
          fi

      - name: Set up QEMU
        if: steps.ver.outputs.build == 'true'
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        if: steps.ver.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        if: steps.ver.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DBP_DOCKERHUB_CREDENTIAL_USERNAME }}
          password: ${{ secrets.DBP_DOCKERHUB_CREDENTIAL_TOKEN_PUSHIMAGES }}
      - name: Build and push
        if: steps.ver.outputs.build == 'true'
        uses: docker/build-push-action@v5
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: docker.io/dbpedia/databus:${{ steps.ver.outputs.version }}
      - name: Tag the commit
        if: steps.ver.outputs.build == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          git tag -f "$VERSION"
          git push origin "refs/tags/${VERSION}" --force
